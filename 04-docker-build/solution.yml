# 4회차 실습 "정답" 워크플로우 (참고용)
# 실습.md 미션을 먼저 풀어본 뒤 비교하세요.
# 실제로 쓰려면 .github/workflows/04-docker.yml 로 만들면 됩니다.
name: 04 - Docker Build

on:
  workflow_dispatch:
  push:
    paths:
      - "04-docker-build/app/**"
      - ".github/workflows/04-docker.yml"
  pull_request:
    paths:
      - "04-docker-build/app/**"
      - ".github/workflows/04-docker.yml"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 (push 안 함)
        uses: docker/build-push-action@v6
        with:
          context: ./04-docker-build/app
          push: false
          load: true
          tags: |
            cicd-study-sample:latest
            cicd-study-sample:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 스모크 테스트 (컨테이너 실행)
        run: |
          docker run --rm cicd-study-sample:latest 30000 4 | tee out.txt
          grep "1인당" out.txt
