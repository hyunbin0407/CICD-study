name: 04 - Docker Build

on:
  workflow_dispatch:
  push:
    paths:
      - "04-docker-build/app/**"
      - ".github/workflows/04-docker.yml"
  pull_request:
    paths:
      - "04-docker-build/app/**"
      - ".github/workflows/04-docker.yml"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 (push 안 함)
        uses: docker/build-push-action@v6
        with:
          context: ./04-docker-build/app
          push: false
          load: true
          tags: cicd-study-sample:latest
