name: 06 - Triggers

on:
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-auto-test/app
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 03-auto-test/app/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 테스트 실행
        run: npm test

  deploy-simulate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: prod 배포 (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "🚀 prod 배포! (ref=${{ github.ref }})"

      - name: staging 배포 (develop push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          echo "🧪 staging 배포! (ref=${{ github.ref }})"
