name: My First Workflow

on:
  workflow_dispatch:
  push:
    paths:
      - "02-first-workflow/**"
      - ".github/workflows/hello.yml"

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 실행 정보 출력
        run: |
          echo "실행한 사람: ${{ github.actor }}"
          echo "트리거 이벤트: ${{ github.event_name }}"
          echo "브랜치: ${{ github.ref_name }}"

      - name: 파일 목록
        run: ls -al
