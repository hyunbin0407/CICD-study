name: 09 - Deploy

on:
  push:
    branches:
      - main
    paths:
      - "09-deploy/**"
      - ".github/workflows/09-deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 09-deploy/app
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 09-deploy/app/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 테스트 실행
        run: npm test

  docker-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 빌드 + push
        uses: docker/build-push-action@v6
        with:
          context: 09-deploy/app
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/gusqls0718/cicd-study-deploy:latest
            docker.io/gusqls0718/cicd-study-deploy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Hook 값 형식 확인 (디버그용, 내용은 출력 안 함)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "길이: ${#HOOK}"
          echo "https:// 시작: $( [[ "$HOOK" == https://* ]] && echo yes || echo no )"
          echo "render.com 포함: $( [[ "$HOOK" == *render.com* ]] && echo yes || echo no )"
          echo "공백/개행 포함: $( [[ "$HOOK" =~ [[:space:]] ]] && echo yes || echo no )"

      - name: Render API 연결 확인 (디버그용)
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}, %{time_total}s\n" --max-time 10 https://api.render.com

      - name: Render Deploy Hook 호출
        run: |
          curl -sf --max-time 20 --retry 2 --retry-delay 3 -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
