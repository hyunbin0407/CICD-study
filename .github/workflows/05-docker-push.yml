name: 05 - Docker Push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "04-docker-build/app/**"
      - ".github/workflows/05-docker-push.yml"
  pull_request:
    paths:
      - "04-docker-build/app/**"
      - ".github/workflows/05-docker-push.yml"

jobs:
  docker-push:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인 (PR에는 안 함)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 (+ push는 PR에는 안 함)
        uses: docker/build-push-action@v6
        with:
          context: ./04-docker-build/app
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/cicd-study-sample:latest
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/cicd-study-sample:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: push된 이미지 pull 검증 (PR에는 안 함)
        if: github.event_name != 'pull_request'
        run: |
          docker pull docker.io/${{ vars.DOCKERHUB_USERNAME }}/cicd-study-sample:latest
          docker run --rm docker.io/${{ vars.DOCKERHUB_USERNAME }}/cicd-study-sample:latest 30000 4 | tee out.txt
          grep "1인당" out.txt
