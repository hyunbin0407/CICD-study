name: 03 - CI Test

on:
  workflow_dispatch:
  push:
    paths:
      - "03-auto-test/app/**"
      - ".github/workflows/03-test.yml"
  pull_request:
    paths:
      - "03-auto-test/app/**"
      - ".github/workflows/03-test.yml"

defaults:
  run:
    working-directory: 03-auto-test/app

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node }} 설치
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: 03-auto-test/app/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 테스트 실행
        run: npm test
