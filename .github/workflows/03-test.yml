name: 03 - CI Test

on:
  workflow_dispatch:
  push:
    paths:
      - "03-auto-test/app/**"
      - ".github/workflows/03-test.yml"
  pull_request:
    paths:
      - "03-auto-test/app/**"
      - ".github/workflows/03-test.yml"

defaults:
  run:
    working-directory: 03-auto-test/app   # run: 스텝은 앱 폴더에서 실행

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 03-auto-test/app/package-lock.json

      - name: 의존성 설치 (lockfile 그대로)
        run: npm ci

      - name: 테스트 실행
        run: npm test
