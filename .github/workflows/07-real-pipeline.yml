name: 07 - Real Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "수동 배포할 환경"
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "07-real-pipeline/app/**"
      - ".github/workflows/07-real-pipeline.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: notesdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: 07-real-pipeline/app
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 07-real-pipeline/app/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 테스트 실행 (MySQL service container 연결)
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_NAME: notesdb
        run: npm test

  docker-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: QEMU 설정 (멀티 아키텍처 빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인 (PR에는 안 함)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 (+ push는 PR에는 안 함)
        uses: docker/build-push-action@v6
        with:
          context: ./07-real-pipeline/app
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/cicd-study-notes:latest
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/cicd-study-notes:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
